name: Terraform Apply

# Applies infra changes. dev auto-applies on merge to main; staging/prod require
# manual dispatch and a protected GitHub Environment approval. Uses an OIDC role
# with apply permissions (separate, more-privileged role than plan).
#
# Bootstrap (state backend) has its own workflow: .github/workflows/terraform-bootstrap.yml

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "environments/dev/**"
  #     - "modules/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options: [dev, staging, prod]
      adopt_orphans:
        description: "Import orphaned AWS resources into state before apply (one-time recovery — only if resources already exist in AWS)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "ap-south-1"
  AWS_ACCOUNT_ID: "174765206872"

concurrency:
  group: apply-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false   # never cancel a running apply

jobs:
  apply:
    name: apply (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    # GitHub Environment provides the approval gate + scoped secrets.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        uses: ./.github/actions/verify-aws-account
        with:
          expected_account_id: ${{ env.AWS_ACCOUNT_ID }}

      - name: Configure Git for private Terraform modules
        uses: ./.github/actions/setup-private-modules
        with:
          token: ${{ secrets.GH_MODULE_TOKEN }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Adopt orphaned AWS resources into state
        if: github.event.inputs.adopt_orphans == 'true'
        run: bash ../../scripts/adopt-orphans.sh "${{ github.event.inputs.environment || 'dev' }}"

      - name: Recover failed node group (delete CREATE_FAILED before apply)
        run: bash ../../scripts/recover-failed-nodegroup.sh "${{ github.event.inputs.environment || 'dev' }}"

      - name: Fix degraded addons (pin vpc-cni/kube-proxy to cluster version)
        run: bash ../../scripts/fix-eks-addons.sh "${{ github.event.inputs.environment || 'dev' }}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
