name: Terraform Apply

# Applies infra changes. dev auto-applies on merge to main; staging/prod require
# manual dispatch and a protected GitHub Environment approval. Uses an OIDC role
# with apply permissions (separate, more-privileged role than plan).
#
# Bootstrap (state backend) has its own workflow: .github/workflows/terraform-bootstrap.yml

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "environments/dev/**"
  #     - "modules/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options: [dev, staging, prod]
      adopt_orphans:
        description: "Import orphaned AWS resources into state before apply (one-time recovery — only if resources already exist in AWS)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "ap-south-1"
  AWS_ACCOUNT_ID: "765574565805"

concurrency:
  group: apply-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false   # never cancel a running apply

jobs:
  apply:
    name: apply (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    # GitHub Environment provides the approval gate + scoped secrets.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        uses: ./.github/actions/verify-aws-account
        with:
          expected_account_id: ${{ env.AWS_ACCOUNT_ID }}

      - name: Configure Git for private Terraform modules
        uses: ./.github/actions/setup-private-modules
        with:
          token: ${{ secrets.GH_MODULE_TOKEN }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Adopt orphaned AWS resources into state
        if: github.event.inputs.adopt_orphans == 'true'
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          case "$ENV" in
            dev)     CLUSTER=eks-dev-eks;     VPC_PREFIX=eks-dev ;;
            staging) CLUSTER=eks-staging-eks; VPC_PREFIX=eks-staging ;;
            prod)    CLUSTER=eks-prod-eks;    VPC_PREFIX=eks-prod ;;
          esac

          import_if_missing() {
            local addr="$1" id="$2"
            shift 2
            if terraform state show "$addr" >/dev/null 2>&1; then
              echo "Already in state: $addr"
              return 0
            fi
            if ! "$@"; then
              echo "Skip import — not in AWS (will be created by apply): $addr"
              return 0
            fi
            echo "Importing $addr <= $id"
            terraform import -input=false "$addr" "$id"
          }

          log_group_exists() {
            local name="$1"
            [[ "$(aws logs describe-log-groups --log-group-name-prefix "$name" \
              --query "logGroups[?logGroupName=='${name}'] | length(@)" --output text 2>/dev/null || echo 0)" == "1" ]]
          }

          LBC_POLICY_ARN="arn:aws:iam::${ACCOUNT}:policy/${CLUSTER}-aws-lb-controller"
          FLOW_LOG_GROUP="/aws/vpc/${VPC_PREFIX}/flow-logs"

          # Only import when AWS still has the resource but state was wiped.
          import_if_missing \
            'module.platform.module.eks_addons.aws_iam_policy.lbc[0]' \
            "$LBC_POLICY_ARN" \
            aws iam get-policy --policy-arn "$LBC_POLICY_ARN"
          import_if_missing \
            'module.platform.module.vpc.aws_cloudwatch_log_group.flow_log' \
            "$FLOW_LOG_GROUP" \
            log_group_exists "$FLOW_LOG_GROUP"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
