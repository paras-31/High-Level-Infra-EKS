name: Terratest

# Pattern Catalog style: matrix over environments (dev/staging/prod).
# PR/push = static validate only. Manual dispatch = validate + live AWS checks.

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - "tests/**"
      - ".github/workflows/terratest.yml"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - "tests/**"
      - ".github/workflows/terratest.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment for live AWS validation
        required: true
        type: choice
        options: [dev, staging, prod]
      run_live_checks:
        description: Run live AWS health checks (requires deployed cluster)
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"
  GO_VERSION: "1.22.x"
  AWS_REGION: "ap-south-1"

concurrency:
  group: terratest-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.inputs.environment || 'matrix' }}
  cancel-in-progress: false

jobs:
  get-environments:
    name: Resolve test matrix
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set.outputs.environments }}
      skip_live: ${{ steps.set.outputs.skip_live }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'environments=["${{ github.event.inputs.environment }}"]' >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event.inputs.run_live_checks }}" == "true" ]]; then
              echo "skip_live=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip_live=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'environments=["dev","staging","prod"]' >> "$GITHUB_OUTPUT"
            echo "skip_live=true" >> "$GITHUB_OUTPUT"
          fi

  terratest:
    name: terratest (${{ matrix.environment }})
    needs: get-environments
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        environment: ${{ fromJson(needs.get-environments.outputs.environments) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tests/go.sum

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        if: needs.get-environments.outputs.skip_live != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        if: needs.get-environments.outputs.skip_live != 'true'
        uses: ./.github/actions/verify-aws-account
        with:
          role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}

      - name: Resolve AWS account
        if: needs.get-environments.outputs.skip_live != 'true'
        id: aws
        uses: ./.github/actions/resolve-aws-account
        with:
          role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws_region: ${{ env.AWS_REGION }}

      - name: Configure Git for private Terraform modules
        uses: ./.github/actions/setup-private-modules
        with:
          token: ${{ secrets.GH_MODULE_TOKEN }}

      - name: Go mod download
        working-directory: tests
        run: go mod download

      - name: Unit tests
        working-directory: tests
        run: go test ./... -v -timeout 5m -run TestIsClusterNameOutput

      - name: Terratest (${{ matrix.environment }})
        working-directory: tests
        env:
          TEST_ENVIRONMENT: ${{ matrix.environment }}
          AWS_REGION: ${{ env.AWS_REGION }}
          TEST_AWS_ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
          TERRATEST_SKIP_LIVE: ${{ needs.get-environments.outputs.skip_live }}
        run: go test ./... -v -timeout 30m -run TestTerraform

      - name: Summary
        if: always()
        run: |
          echo "Terratest finished for ${{ matrix.environment }}."
          echo "skip_live=${{ needs.get-environments.outputs.skip_live }}"
