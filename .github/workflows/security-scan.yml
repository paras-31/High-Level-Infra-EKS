name: Security Scan

# Policy-as-code gate: static analysis (Checkov, tfsec, Trivy) on the source,
# plus OPA/Conftest guardrails against each environment's plan. Blocks the PR
# on any failure and uploads SARIF to the Security tab.

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "environments/**"
      - "modules/**"
      - "policies/**"
      - ".github/workflows/security-scan.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to scan (informational only; all envs still run)
        required: false
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read
  security-events: write   # upload SARIF
  id-token: write

jobs:
  static-analysis:
    name: Static analysis (Checkov + tfsec + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          config_file: policies/.checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          working_directory: .
          sarif_file: tfsec.sarif

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  opa-guardrails:
    name: OPA/Conftest guardrails (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Terraform plan -> JSON
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Setup Conftest
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz \
            | sudo tar xz -C /usr/local/bin conftest

      - name: Conftest guardrails
        run: conftest test plan.json --policy ../../policies/opa --all-namespaces
