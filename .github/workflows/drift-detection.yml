name: Drift Detection

# Scheduled plan against real state to catch out-of-band ("clickops") changes.
# Opens/updates a GitHub issue when drift is found. Read-only role.

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 06:00 UTC, weekdays
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "ap-south-1"

jobs:
  drift:
    name: drift (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        uses: ./.github/actions/verify-aws-account
        with:
          role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}

      - name: Configure Git for private Terraform modules
        uses: ./.github/actions/setup-private-modules
        with:
          token: ${{ secrets.GH_MODULE_TOKEN }}

      - name: Terraform init
        uses: ./.github/actions/terraform-init
        with:
          role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws_region: ${{ env.AWS_REGION }}
          stack: ${{ matrix.environment }}
          working_directory: environments/${{ matrix.environment }}

      - name: Detect drift
        id: drift
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -no-color -out=tfplan
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > drift.txt || true
          # 0 = no changes, 2 = drift, 1 = error
          if [ "$code" = "1" ]; then exit 1; fi

      - name: Open/append drift issue
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            let drift = fs.readFileSync('environments/' + env + '/drift.txt', 'utf8');
            if (drift.length > 60000) drift = drift.slice(0, 60000) + '\n... (truncated)';
            const title = `Infra drift detected: ${env}`;
            const body = `Drift detected in \`${env}\` on ${new Date().toISOString()}.\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${drift}\n\`\`\`\n</details>`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift'
            });
            const found = existing.data.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['drift'] });
            }
