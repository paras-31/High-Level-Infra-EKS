name: Terraform Destroy

# ⚠️ DESTRUCTIVE. Tears down everything Terraform created in an environment.
# Safeguards:
#   * manual dispatch only (never runs automatically)
#   * you must type the exact confirmation phrase "destroy <environment>"
#   * runs inside a protected GitHub Environment (add required reviewers!)
#   * uses the apply (write) OIDC role
#
# It also handles the things a plain `terraform destroy` cannot:
#   * strips `prevent_destroy` in the CI checkout ONLY (never committed)
#   * empties versioned S3 buckets and ECR repositories first

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to DESTROY"
        required: true
        type: choice
        options: [dev, staging, prod]
      confirm:
        description: 'Type "destroy <environment>" to confirm (e.g. destroy dev)'
        required: true
        type: string
      destroy_bootstrap:
        description: "Also destroy the state backend (bootstrap). Do this LAST, after all envs are gone."
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "ap-south-1"

concurrency:
  group: destroy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    name: destroy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}   # approval gate
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment }}
    steps:
      - name: Verify confirmation phrase
        run: |
          expected="destroy ${{ github.event.inputs.environment }}"
          if [ "${{ github.event.inputs.confirm }}" != "$expected" ]; then
            echo "::error::Confirmation mismatch. Expected '$expected'." && exit 1
          fi
          echo "Confirmed teardown of ${{ github.event.inputs.environment }}."

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Neutralize prevent_destroy (CI workspace only)
        run: |
          # Allow Terraform to delete lifecycle-protected buckets during destroy.
          # This edit lives only on the runner — it is never committed.
          find "$GITHUB_WORKSPACE" -name '*.tf' -type f \
            -exec sed -i 's/prevent_destroy *= *true/prevent_destroy = false/g' {} +
          echo "prevent_destroy disabled in workspace."

      - name: Terraform init
        run: terraform init -input=false

      - name: Empty S3 buckets in state
        run: |
          set -euo pipefail
          buckets=$(terraform state pull | jq -r '.resources[]? | select(.type=="aws_s3_bucket") | .instances[].attributes.bucket' | sort -u)
          for b in $buckets; do
            echo "Emptying s3://$b (all versions + delete markers)"
            aws s3 rm "s3://$b" --recursive || true
            # purge versions/markers so a versioned bucket can be deleted
            versions=$(aws s3api list-object-versions --bucket "$b" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{}')
            if [ "$(echo "$versions" | jq '.Objects | length // 0')" -gt 0 ]; then
              aws s3api delete-objects --bucket "$b" --delete "$versions" || true
            fi
            markers=$(aws s3api list-object-versions --bucket "$b" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{}')
            if [ "$(echo "$markers" | jq '.Objects | length // 0')" -gt 0 ]; then
              aws s3api delete-objects --bucket "$b" --delete "$markers" || true
            fi
          done

      - name: Empty ECR repositories in state
        run: |
          set -euo pipefail
          repos=$(terraform state pull | jq -r '.resources[]? | select(.type=="aws_ecr_repository") | .instances[].attributes.name' | sort -u)
          for r in $repos; do
            echo "Deleting all images in ECR repo $r"
            ids=$(aws ecr list-images --repository-name "$r" --query 'imageIds[*]' --output json 2>/dev/null || echo '[]')
            if [ "$(echo "$ids" | jq 'length')" -gt 0 ]; then
              aws ecr batch-delete-image --repository-name "$r" --image-ids "$ids" || true
            fi
          done

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve

      - name: Summary
        if: always()
        run: echo "Destroy of ${{ github.event.inputs.environment }} finished. Note: KMS keys enter a pending-deletion window rather than deleting immediately."

  # Optional: tear down the remote-state backend itself. Run ONLY after every
  # environment above is destroyed. Requires the bootstrap state to be reachable.
  destroy-bootstrap:
    name: destroy bootstrap (state backend)
    needs: destroy
    if: ${{ github.event.inputs.destroy_bootstrap == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Neutralize prevent_destroy (CI workspace only)
        run: |
          find "$GITHUB_WORKSPACE/bootstrap" -name '*.tf' -type f \
            -exec sed -i 's/prevent_destroy *= *true/prevent_destroy = false/g' {} +

      - name: Terraform init
        run: terraform init -input=false

      - name: Empty state bucket
        run: |
          set -euo pipefail
          b=$(terraform state pull | jq -r '.resources[]? | select(.type=="aws_s3_bucket") | .instances[].attributes.bucket' | head -1)
          if [ -n "$b" ]; then
            echo "Emptying state bucket s3://$b"
            aws s3 rm "s3://$b" --recursive || true
            versions=$(aws s3api list-object-versions --bucket "$b" --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{}')
            [ "$(echo "$versions" | jq '.Objects | length // 0')" -gt 0 ] && aws s3api delete-objects --bucket "$b" --delete "$versions" || true
            markers=$(aws s3api list-object-versions --bucket "$b" --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{}')
            [ "$(echo "$markers" | jq '.Objects | length // 0')" -gt 0 ] && aws s3api delete-objects --bucket "$b" --delete "$markers" || true
          fi

      - name: Terraform destroy (backend)
        run: terraform destroy -input=false -auto-approve
