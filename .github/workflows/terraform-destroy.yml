name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy (dev / staging / prod)"
        required: true
        type: choice
        options: [dev, staging, prod]
      acknowledge_destruction:
        description: I understand this permanently deletes all resources in the selected environment
        required: true
        type: boolean
      destroy_bootstrap:
        description: Also destroy bootstrap state backend
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "ap-south-1"
  AWS_ACCOUNT_ID: "765574565805"

concurrency:
  group: destroy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    name: destroy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify destruction acknowledged
        working-directory: .
        env:
          SELECTED_ENV: ${{ github.event.inputs.environment }}
          ACKNOWLEDGED: ${{ github.event.inputs.acknowledge_destruction }}
        run: |
          set -euo pipefail
          echo "Environment to destroy: ${SELECTED_ENV}"
          if [ "${ACKNOWLEDGED}" != "true" ]; then
            echo "::error::Check the box: I understand this permanently deletes all resources."
            exit 1
          fi
          echo "Confirmed teardown of ${SELECTED_ENV}."

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        uses: ./.github/actions/verify-aws-account
        with:
          expected_account_id: ${{ env.AWS_ACCOUNT_ID }}

      - name: Neutralize prevent_destroy (CI workspace only)
        run: |
          find "$GITHUB_WORKSPACE" -name '*.tf' -type f \
            -exec sed -i 's/prevent_destroy *= *true/prevent_destroy = false/g' {} +
          echo "prevent_destroy disabled in workspace."

      - name: Configure Git for private Terraform modules
        uses: ./.github/actions/setup-private-modules
        with:
          token: ${{ secrets.GH_MODULE_TOKEN }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Empty S3 buckets in state
        run: |
          set -euo pipefail
          buckets=$(terraform state pull | jq -r '.resources[]? | select(.type=="aws_s3_bucket") | .instances[].attributes.bucket' | sort -u)
          for b in $buckets; do
            echo "Emptying s3://$b (all versions + delete markers)"
            aws s3 rm "s3://$b" --recursive || true
            versions=$(aws s3api list-object-versions --bucket "$b" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{}')
            if [ "$(echo "$versions" | jq '.Objects | length // 0')" -gt 0 ]; then
              aws s3api delete-objects --bucket "$b" --delete "$versions" || true
            fi
            markers=$(aws s3api list-object-versions --bucket "$b" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{}')
            if [ "$(echo "$markers" | jq '.Objects | length // 0')" -gt 0 ]; then
              aws s3api delete-objects --bucket "$b" --delete "$markers" || true
            fi
          done

      - name: Empty ECR repositories in state
        run: |
          set -euo pipefail
          repos=$(terraform state pull | jq -r '.resources[]? | select(.type=="aws_ecr_repository") | .instances[].attributes.name' | sort -u)
          for r in $repos; do
            echo "Deleting all images in ECR repo $r"
            ids=$(aws ecr list-images --repository-name "$r" --query 'imageIds[*]' --output json 2>/dev/null || echo '[]')
            if [ "$(echo "$ids" | jq 'length')" -gt 0 ]; then
              aws ecr batch-delete-image --repository-name "$r" --image-ids "$ids" || true
            fi
          done

      - name: Delete EKS node groups (required before cluster delete)
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment }}"
          case "$ENV" in
            dev)     FALLBACK_CLUSTER=eks-dev-eks ;;
            staging) FALLBACK_CLUSTER=eks-staging-eks ;;
            prod)    FALLBACK_CLUSTER=eks-prod-eks ;;
          esac

          clusters=$(terraform state pull | jq -r '.resources[]? | select(.type=="aws_eks_cluster") | .instances[].attributes.name' | sort -u)
          if [ -z "$clusters" ]; then
            clusters="$FALLBACK_CLUSTER"
          fi

          for cluster in $clusters; do
            echo "Checking node groups for cluster: $cluster"
            if ! aws eks describe-cluster --name "$cluster" >/dev/null 2>&1; then
              echo "Cluster $cluster not found — skipping."
              continue
            fi
            nodegroups=$(aws eks list-nodegroups --cluster-name "$cluster" --query 'nodegroups[]' --output text 2>/dev/null || true)
            if [ -z "$nodegroups" ]; then
              echo "No node groups on $cluster."
              continue
            fi
            for ng in $nodegroups; do
              status=$(aws eks describe-nodegroup --cluster-name "$cluster" --nodegroup-name "$ng" \
                --query 'nodegroup.status' --output text 2>/dev/null || echo "NOT_FOUND")
              if [ "$status" = "NOT_FOUND" ]; then
                continue
              fi
              echo "Deleting node group $ng (status: $status) on $cluster"
              aws eks delete-nodegroup --cluster-name "$cluster" --nodegroup-name "$ng" || true
            done
            for ng in $nodegroups; do
              echo "Waiting for node group $ng to finish deleting..."
              aws eks wait nodegroup-deleted --cluster-name "$cluster" --nodegroup-name "$ng" 2>/dev/null || true
            done
          done

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve

      - name: Summary
        if: always()
        run: echo "Destroy of ${{ github.event.inputs.environment }} finished."

  destroy-bootstrap:
    name: destroy bootstrap (state backend)
    needs: destroy
    if: ${{ github.event.inputs.destroy_bootstrap == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        uses: ./.github/actions/verify-aws-account
        with:
          expected_account_id: ${{ env.AWS_ACCOUNT_ID }}

      - name: Neutralize prevent_destroy (CI workspace only)
        run: |
          find "$GITHUB_WORKSPACE/bootstrap" -name '*.tf' -type f \
            -exec sed -i 's/prevent_destroy *= *true/prevent_destroy = false/g' {} +

      - name: Terraform init
        run: terraform init -input=false

      - name: Empty state bucket
        run: |
          set -euo pipefail
          b=$(terraform state pull | jq -r '.resources[]? | select(.type=="aws_s3_bucket") | .instances[].attributes.bucket' | head -1)
          if [ -n "$b" ]; then
            echo "Emptying state bucket s3://$b"
            aws s3 rm "s3://$b" --recursive || true
            versions=$(aws s3api list-object-versions --bucket "$b" --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{}')
            [ "$(echo "$versions" | jq '.Objects | length // 0')" -gt 0 ] && aws s3api delete-objects --bucket "$b" --delete "$versions" || true
            markers=$(aws s3api list-object-versions --bucket "$b" --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{}')
            [ "$(echo "$markers" | jq '.Objects | length // 0')" -gt 0 ] && aws s3api delete-objects --bucket "$b" --delete "$markers" || true
          fi

      - name: Terraform destroy (backend)
        run: terraform destroy -input=false -auto-approve
