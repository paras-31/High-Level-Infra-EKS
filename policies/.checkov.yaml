# Checkov configuration — static security scanning for Terraform.
# Run locally:  checkov -d . --config-file policies/.checkov.yaml
framework:
  - terraform
  - github_actions

# Fail the build on any HARD-failed check.
compact: true
quiet: true
download-external-modules: false

# Directories Checkov should not scan.
skip-path:
  - .terraform
  - .git

# Checks we consciously accept (document every skip with a reason).
skip-check:
  # CKV_AWS_39: public API intentionally enabled but locked to admin_access_cidrs /32 only.
  - CKV_AWS_39
  # CKV2_AWS_5: SG "attached to a resource" false-positives on rule-only SGs.
  - CKV2_AWS_5
  # EKS add-on controllers (LBC, Karpenter, external-dns) require broad IAM; scoped by IRSA.
  - CKV_AWS_355
  - CKV_AWS_289
  - CKV_AWS_290
  # Bootstrap lock table uses AWS-managed DynamoDB encryption (KMS CMK optional for state lock).
  - CKV_AWS_119

# Treat these as errors (belt-and-suspenders on top of defaults).
hard-fail-on:
  - CKV_AWS_39   # EKS API endpoint must be private
  - CKV_AWS_38   # EKS public endpoint not open to 0.0.0.0/0
  - CKV_AWS_58   # EKS secrets encryption
  - CKV_AWS_37   # EKS control-plane logging
  - CKV_AWS_79   # IMDSv2 required
  - CKV_AWS_189  # EBS encrypted with CMK
